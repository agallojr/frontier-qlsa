[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-qlsa"
version = "0.1.0"
description = "qlsa forked from ornl"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core dependencies
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "matplotlib>=3.10.7",
    "PyYAML>=6.0.3",
    # Quantum computing dependencies (matching fvm_euler_1d_solver)
    "quantum_linear_solvers @ git+https://github.com/agallojr/quantum_linear_solvers",
    "qiskit>=2.2.3,<3.0",
    "qiskit-algorithms>=0.4.0",
    "qiskit-ibm-runtime>=0.43.1",
    "qiskit-aer>=0.17.2",
    "qiskit-qasm3-import>=0.6.0",
    "ddt>=1.7.2",
    "importlib-metadata>=8.7.0",
    "mapomatic>=0.14.0",
    "mthree>=3.0.0",
    "pylatexenc>=2.10",
    "lwfm",
]

[tool.uv.sources]
lwfm = { path = "../lwfm", editable = true }

[tool.setuptools]
packages = ["frontier_qlsa"]
py-modules = [
    "circuit_HHL",
    "func_HeleShaw",
    "func_matrix_vector",
    "func_qc",
    "solver",
]

[tool.black]
line-length = 88
[tool.ruff]
line-length = 88


